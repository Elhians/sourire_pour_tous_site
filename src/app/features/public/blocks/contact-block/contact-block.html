<section id="contact" class="bg-primary py-16 px-4 sm:px-6 lg:px-8">
  <div class="max-w-4xl mx-auto text-center">
    <h2 class="text-3xl font-extrabold text-white sm:text-4xl font-heading mb-6">
      Une question ? Envie de nous rejoindre ?
    </h2>
    <p class="text-xl text-red-100 mb-10 leading-relaxed">
      N'hésitez pas à nous envoyer un message, notre équipe vous répondra dans les plus brefs délais.
    </p>
    <div class="flex flex-col sm:flex-row justify-center items-center space-y-4 sm:space-y-0 sm:space-x-6">
      <a routerLink="/contact" class="inline-flex items-center justify-center px-8 py-4 border border-transparent text-lg font-bold rounded-full text-primary bg-white hover:bg-gray-50 hover:scale-105 shadow-xl transition-all duration-300 uppercase tracking-wide cursor-pointer w-full sm:w-auto">
        Nous Contacter
        <svg class="ml-2 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
      </a>
      <a [href]="'mailto:' + (settings()?.contact_email || 'contact@sourirepourtous.org')" class="inline-flex items-center justify-center px-8 py-4 border-2 border-white/30 text-lg font-bold rounded-full text-white hover:bg-white/10 transition-colors uppercase tracking-wide w-full sm:w-auto">
        Email direct
      </a>
    </div>
  </div>
</section>
