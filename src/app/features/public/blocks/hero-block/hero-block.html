<section class="relative bg-white overflow-hidden min-h-screen flex flex-col w-full pt-20">
  <div class="absolute inset-y-0 right-0 w-full lg:w-1/2 bg-gray-100 border-l border-gray-100 opacity-20 lg:opacity-100 z-0">
    <img class="h-full w-full object-cover" 
         fetchpriority="high" loading="eager"
         src="https://images.unsplash.com/photo-1593113646773-028c64a8f1b8?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80" 
         alt="Bénévoles Sourire Pour Tous">
  </div>

  <div class="max-w-7xl mx-auto flex flex-1 w-full relative z-10">
    <div class="relative bg-white/90 lg:max-w-2xl lg:w-full flex flex-1 items-center justify-center w-full lg:bg-transparent">
      <!-- Background blanc pour grand écran -->
      <div class="hidden lg:block absolute inset-0 bg-white"></div>
      
      <!-- Un design oblique pour l'image -->
      <svg class="hidden lg:block absolute right-0 inset-y-0 h-full w-48 text-white transform translate-x-1/2 z-10" fill="currentColor" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <polygon points="50,0 100,0 50,100 0,100"></polygon>
      </svg>

      <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 relative z-20 py-12 lg:py-0 w-full">
        <div class="sm:text-center lg:text-left">
          <h1 class="text-4xl tracking-tight font-extrabold text-gray-900 sm:text-5xl md:text-6xl font-heading">
            <span class="block xl:inline">{{ config.title || 'Sourire Pour Tous' }}</span>
          </h1>
          <p class="mt-3 text-base text-gray-500 sm:mt-5 sm:text-lg sm:max-w-xl sm:mx-auto md:mt-5 md:text-xl lg:mx-0 leading-relaxed">
            {{ config.subtitle || 'Agissons ensemble pour redonner le sourire à ceux qui en ont besoin.' }}
          </p>
          <div class="mt-8 sm:mt-10 sm:flex sm:justify-center lg:justify-start">
            <div class="rounded-full shadow-lg hover:shadow-xl transition-shadow">
              <a routerLink="/don" class="inline-flex items-center justify-center px-8 py-4 border border-transparent text-lg font-bold rounded-full text-white bg-primary hover:bg-red-700 hover:scale-105 shadow-lg shadow-red-500/30 transition-all duration-300 uppercase tracking-wide cursor-pointer w-full sm:w-auto">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                {{ config.ctaText || 'Faire un don' }}
              </a>
            </div>
            <div class="mt-3 sm:mt-0 sm:ml-4 rounded-full shadow hover:shadow-md transition-shadow">
              <a routerLink="/actions" class="w-full flex items-center justify-center px-8 py-3 border border-transparent text-base font-bold rounded-full text-primary bg-red-50 hover:bg-red-100 md:py-4 md:text-lg md:px-10 transition-colors uppercase tracking-wide cursor-pointer">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                Nos actions
              </a>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  
  <!-- Flèche de scroll -->
  <div class="absolute bottom-8 left-0 right-0 w-full flex justify-center z-30 animate-bounce">
    <a href="#about" aria-label="Défiler vers le bas" class="text-gray-400 hover:text-primary transition-colors p-2 bg-white/80 rounded-full shadow-sm backdrop-blur-sm border border-gray-100">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
      </svg>
    </a>
  </div>
</section>
