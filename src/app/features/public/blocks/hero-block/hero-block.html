<section class="relative min-h-screen flex items-center justify-center pt-20 overflow-hidden">
  
  <!-- Full Background Image with Dark Overlay -->
  <div class="absolute inset-0 z-0">
    <img class="w-full h-full object-cover" 
         src="https://images.unsplash.com/photo-1593113646773-028c64a8f1b8?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" 
         srcset="https://images.unsplash.com/photo-1593113646773-028c64a8f1b8?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80 600w,
                 https://images.unsplash.com/photo-1593113646773-028c64a8f1b8?ixlib=rb-1.2.1&auto=format&fit=crop&w=1200&q=80 1200w,
                 https://images.unsplash.com/photo-1593113646773-028c64a8f1b8?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80 1950w"
         sizes="100vw"
         fetchpriority="high" 
         loading="eager"
         alt="Bénévoles Sourire Pour Tous">
    <div class="absolute inset-0 bg-gray-900/60"></div>
  </div>

  <!-- Content -->
  <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center w-full">
    <h1 class="text-4xl tracking-tight font-extrabold text-white sm:text-5xl md:text-6xl font-heading drop-shadow-md">
      <span class="block">{{ config.title || 'Sourire Pour Tous' }}</span>
    </h1>
    <p class="mt-4 text-base text-gray-200 sm:mt-5 sm:text-lg sm:max-w-xl sm:mx-auto md:mt-5 md:text-xl leading-relaxed drop-shadow">
      {{ config.subtitle || 'Agissons ensemble pour redonner le sourire à ceux qui en ont besoin.' }}
    </p>
    
    <!-- Buttons -->
    <div class="mt-10 sm:flex sm:justify-center gap-4">
      <a routerLink="/don" class="w-full sm:w-auto inline-flex items-center justify-center px-8 py-4 border border-transparent text-lg font-bold rounded-full text-white bg-primary hover:bg-red-700 hover:scale-105 shadow-lg shadow-red-500/50 transition-all duration-300 uppercase tracking-wide cursor-pointer">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
        {{ config.ctaText || 'Faire un don' }}
      </a>
      <a routerLink="/actions" class="mt-4 sm:mt-0 w-full sm:w-auto inline-flex items-center justify-center px-8 py-4 border-2 border-white/80 text-lg font-bold rounded-full text-white hover:bg-white hover:text-gray-900 transition-colors uppercase tracking-wide cursor-pointer">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        Nos actions
      </a>
    </div>
  </div>
  
  <!-- Flèche de scroll -->
  <div class="absolute bottom-8 left-0 right-0 w-full flex justify-center z-30 animate-bounce">
    <a href="#about" aria-label="Défiler vers le bas" class="text-gray-400 hover:text-primary transition-colors p-2 bg-white/80 rounded-full shadow-sm backdrop-blur-sm border border-gray-100">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
      </svg>
    </a>
  </div>
</section>
