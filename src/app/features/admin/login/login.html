<main class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg border border-gray-100">
    <div>
      <h2 class="text-center text-3xl font-extrabold text-primary font-heading tracking-tight">
        Sourire Pour Tous
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600 uppercase tracking-widest font-semibold">
        {{ isResetMode() ? 'Mot de passe oublié' : 'Espace Administration' }}
      </p>
    </div>
    
    <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="isResetMode() ? onResetPassword() : onSubmit()">
      @if (errorMessage()) {
        <div class="rounded-md bg-red-50 p-4 border border-red-200">
          <div class="flex">
            <div class="ml-3">
              <h3 class="text-sm font-medium text-red-800">{{ errorMessage() }}</h3>
            </div>
          </div>
        </div>
      }
      
      @if (resetMessage()) {
        <div class="rounded-md bg-green-50 p-4 border border-green-200">
          <div class="flex">
            <div class="ml-3">
              <h3 class="text-sm font-medium text-green-800">{{ resetMessage() }}</h3>
            </div>
          </div>
        </div>
      }

      <div class="rounded-md shadow-sm space-y-4">
        <div>
          <label for="email-address" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input id="email-address" formControlName="email" type="email" autocomplete="email" required
                 class="appearance-none relative block w-full px-3 py-2.5 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-lg focus:outline-none focus:ring-primary focus:border-primary sm:text-sm transition-shadow"
                 placeholder="admin@sourirepourtous.org">
        </div>
        
        @if (!isResetMode()) {
          <div>
            <div class="flex items-center justify-between mb-1">
              <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
              <div class="text-sm">
                <a href="#" (click)="toggleResetMode($event)" class="font-medium text-primary hover:text-red-700 transition-colors">Mot de passe oublié ?</a>
              </div>
            </div>
          <div class="relative">
            <input id="password" formControlName="password" [type]="showPassword() ? 'text' : 'password'" autocomplete="current-password"
                   class="appearance-none relative block w-full px-3 py-2.5 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-lg focus:outline-none focus:ring-primary focus:border-primary sm:text-sm transition-shadow pr-10"
                   placeholder="••••••••">
            <button type="button" (click)="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-500 focus:outline-none z-10 cursor-pointer">
              @if (showPassword()) {
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                </svg>
              } @else {
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              }
            </button>
          </div>
          </div>
        }
      </div>

      <div>
        <button type="submit" [disabled]="(isResetMode() ? loginForm.get('email')?.invalid : loginForm.invalid) || isLoading()"
                class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-primary hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-70 transition-all duration-200 shadow-md">
          @if (isLoading()) {
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            {{ isResetMode() ? 'Envoi en cours...' : 'Connexion...' }}
          } @else {
            {{ isResetMode() ? 'Envoyer le lien' : 'Se connecter' }}
          }
        </button>
      </div>
      
      @if (isResetMode()) {
        <div class="text-center text-sm">
          <a href="#" (click)="toggleResetMode($event)" class="font-medium text-gray-600 hover:text-gray-900 transition-colors">
            &larr; Retour à la connexion
          </a>
        </div>
      }
    </form>
  </div>
</main>
