<div class="flex h-screen bg-gray-100 overflow-hidden">

  <!-- Mobile sidebar overlay -->
  @if (isMobileMenuOpen()) {
    <div class="fixed inset-0 z-40 bg-gray-600 bg-opacity-75 transition-opacity md:hidden" (click)="closeMobileMenu()"></div>
  }

  <!-- Sidebar -->
  <div [class.-translate-x-full]="!isMobileMenuOpen()" 
       [class.translate-x-0]="isMobileMenuOpen()"
       class="fixed inset-y-0 left-0 z-50 w-64 bg-primary text-white flex-shrink-0 transition-transform duration-300 ease-in-out md:translate-x-0 md:static md:inset-auto md:flex md:w-64 md:flex-col shadow-xl md:shadow-none">
    
    <div class="flex items-center justify-between p-4 h-16 border-b border-red-800">
      <div class="text-xl font-bold font-heading">Admin SPT</div>
      <button (click)="closeMobileMenu()" class="md:hidden text-red-200 hover:text-white">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    
    <nav class="mt-4 flex-1 overflow-y-auto">
      <a routerLink="/admin" (click)="closeMobileMenu()" routerLinkActive="bg-secondary" [routerLinkActiveOptions]="{exact: true}" class="block py-3 px-4 hover:bg-secondary transition-colors text-sm font-medium">Dashboard</a>
      <a routerLink="/admin/pages" (click)="closeMobileMenu()" routerLinkActive="bg-secondary" class="block py-3 px-4 hover:bg-secondary transition-colors text-sm font-medium">Accueil (CMS)</a>
      <a routerLink="/admin/articles" (click)="closeMobileMenu()" routerLinkActive="bg-secondary" class="block py-3 px-4 hover:bg-secondary transition-colors text-sm font-medium">Articles</a>
      <a routerLink="/admin/testimonials" (click)="closeMobileMenu()" routerLinkActive="bg-secondary" class="block py-3 px-4 hover:bg-secondary transition-colors text-sm font-medium">Témoignages</a>
      <a routerLink="/admin/team" (click)="closeMobileMenu()" routerLinkActive="bg-secondary" class="block py-3 px-4 hover:bg-secondary transition-colors text-sm font-medium">L'Équipe</a>
      <a routerLink="/admin/messages" (click)="closeMobileMenu()" routerLinkActive="bg-secondary" class="block py-3 px-4 hover:bg-secondary transition-colors text-sm font-medium border-t border-red-800 mt-2">Messages</a>
      <a routerLink="/admin/settings" (click)="closeMobileMenu()" routerLinkActive="bg-secondary" class="block py-3 px-4 hover:bg-secondary transition-colors text-sm font-medium">Paramètres du site</a>
    </nav>
  </div>

  <!-- Main content wrapper -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    
    <!-- Topbar -->
    <header class="h-16 bg-white shadow-sm border-b border-gray-200 flex items-center justify-between px-4 sm:px-6 relative z-10">
      <div class="flex items-center">
        <!-- Hamburger menu button (mobile only) -->
        <button (click)="toggleMobileMenu()" class="text-gray-500 hover:text-gray-700 focus:outline-none md:hidden mr-4">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div class="text-lg sm:text-xl font-semibold text-gray-800 font-heading truncate">Administration</div>
      </div>
      
      <div class="flex items-center">
        <button (click)="logout()" class="text-sm font-medium text-gray-600 hover:text-primary transition-colors flex items-center gap-2">
          <span class="hidden sm:inline">Déconnexion</span>
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-4 sm:p-6 lg:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
